unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Use vim binds in scroll mode
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi V send -X select-line
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel 'xclip -in -selection clipboard'

# Fix tmux colors
set-option -s default-terminal "tmux-256color"
set-option -sa terminal-overrides ",xterm-256color:RGB"
set-option -sa terminal-overrides ",xterm-255color*:Tc"

# Want zsh
set-option -g default-shell /bin/zsh

# Life improvements
bind r source-file ~/config/tmux/tmux.conf
set -s escape-time 0

# Colors
set -g status-bg black
set -g status-fg white
set -g status-position bottom
set -g status-justify left
set -g status-left '#[bg=yellow,fg=black] #S #[bg=black] '
setw -g window-status-current-format '#[fg=yellow,bg=black,nounderscore]{#I:#W}'
setw -g window-status-format ' #I:#W '
set -g default-command "/bin/zsh"
set-option -g focus-events on

# Create windows/splits in current directory
bind  c  new-window      -c "#{pane_current_path}"
bind  %  split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"

# Allow Ctrl-Enter to be sent
bind -n S-Enter send-keys Escape "[13;2u"
bind -n C-Enter send-keys Escape "[13;5u"

# Primeagen Sessionizer
bind-key -n C-f run-shell "tmux neww ~/.local/bin/tmux-sessionizer"

# open choose tree with C-b instead of prefix + w
bind-key -n C-b choose-tree

# plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'
